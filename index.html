<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body { background: #050505; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; }
.bn { font-family: 'Bebas Neue', sans-serif; }

#errorBox { display:none; position:fixed; top:0; left:0; right:0; background:#330000; color:#f66; padding:12px; font-size:11px; font-family:monospace; z-index:9999; white-space:pre-wrap; }

/* Setup */
#setupScreen { display:none; padding:60px 24px; min-height:100vh; }
#setupScreen.on { display:flex; flex-direction:column; justify-content:center; max-width:480px; margin:0 auto; }
.s-title { font-size:44px; letter-spacing:3px; color:#C9A96E; margin-bottom:10px; }
.s-sub { font-size:14px; color:#555; margin-bottom:36px; line-height:1.6; }
#apiInput { width:100%; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:10px; padding:14px 16px; color:#ddd; font-size:15px; outline:none; margin-bottom:16px; font-family:monospace; }
#apiInput:focus { border-color:rgba(201,169,110,0.5); }
#enterBtn { width:100%; background:#C9A96E; border:none; border-radius:10px; padding:14px; color:#000; font-family:‘Bebas Neue’,sans-serif; font-size:18px; letter-spacing:3px; cursor:pointer; }
#keyError { color:#f44; font-size:13px; margin-top:8px; display:none; }

/* Main app container */
#app { display:none; flex-direction:column; height:100vh; height:100dvh; max-width:480px; margin:0 auto; }
#app.on { display:flex; }

/* Tab content */
.tab-content { flex:1; overflow-y:auto; }
.tab-pane { display:none; height:100%; overflow-y:auto; }
.tab-pane.active { display:block; }
#boardPane.active, #chatPane.active { display:flex; flex-direction:column; }

/* Tab bar */
.tab-bar { display:flex; border-top:1px solid rgba(255,255,255,0.06); padding:8px 0 max(env(safe-area-inset-bottom),8px); background:#0a0a0a; flex-shrink:0; }
.tab-btn { flex:1; background:none; border:none; color:#444; font-size:10px; letter-spacing:1px; padding:8px 0 4px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px; }
.tab-btn.active { color:#C9A96E; }
.tab-icon { font-size:20px; }

/* Dashboard */
#dashPane { padding:48px 24px 24px; }
.dash-date { font-size:12px; letter-spacing:5px; color:#555; }
.dash-greet { font-size:44px; letter-spacing:2px; color:#C9A96E; line-height:1; margin:4px 0 8px; }
.dash-tag { font-size:13px; color:#444; margin-bottom:32px; }
.sec { font-size:12px; letter-spacing:3px; color:#444; margin-bottom:12px; }
.act { border-left:2px solid; padding:10px 14px; margin-bottom:8px; }
.act-l { font-size:11px; letter-spacing:2px; margin-bottom:2px; }
.act-d { font-size:13px; color:#aaa; }
.goal { font-size:17px; font-weight:700; letter-spacing:1px; padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.05); }
.gear { position:absolute; top:48px; right:24px; background:none; border:none; color:#333; font-size:16px; cursor:pointer; }

/* Boardroom channel list */
#boardPane { padding:24px; }
.board-title { font-size:28px; letter-spacing:2px; color:#C9A96E; margin-bottom:16px; }
.ch-btn { display:flex; align-items:center; width:100%; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); border-radius:12px; padding:14px; margin-bottom:8px; cursor:pointer; text-align:left; color:#fff; }
.ch-btn:active { opacity:0.7; }
.ch-ico { font-size:20px; margin-right:12px; }
.ch-nm { font-size:15px; font-weight:600; }
.ch-sb { font-size:11px; color:#555; margin-top:1px; }
.ch-ar { margin-left:auto; color:#333; font-size:14px; }

/* Chat — iMessage style */
#chatPane { background:#050505; }
.chat-hdr { padding:16px 20px 12px; border-bottom:1px solid rgba(255,255,255,0.06); flex-shrink:0; display:flex; align-items:center; gap:10px; }
#chatBack { background:none; border:none; color:#C9A96E; font-size:24px; cursor:pointer; padding:0 8px 0 0; }
.chat-info { display:flex; align-items:center; gap:8px; }
#chatIco { font-size:18px; }
#chatNm { font-size:16px; font-weight:600; }
#chatSb { font-size:10px; color:#555; }

#msgArea { flex:1; overflow-y:auto; padding:16px 16px 8px; display:flex; flex-direction:column; gap:8px; }
.empty-st { text-align:center; padding:60px 20px; font-size:13px; color:#333; }

.msg-user { align-self:flex-end; background:#1a6ef5; border-radius:18px 18px 4px 18px; padding:9px 14px; max-width:75%; font-size:15px; color:#fff; line-height:1.4; }
.msg-char-wrap { max-width:80%; }
.msg-char-name { font-size:10px; font-weight:600; letter-spacing:1px; margin:4px 0 2px 4px; }
.msg-char { background:rgba(255,255,255,0.08); border-radius:18px 18px 18px 4px; padding:9px 14px; font-size:15px; color:#eee; line-height:1.4; }

.typing { font-size:13px; color:#555; padding:4px 4px; }
.typing-dots { display:inline-block; }
.typing-dots span { animation:blink 1.4s infinite; opacity:0.2; }
.typing-dots span:nth-child(2) { animation-delay:0.2s; }
.typing-dots span:nth-child(3) { animation-delay:0.4s; }
@keyframes blink { 20% { opacity:1; } 100% { opacity:0.2; } }

.input-row { padding:8px 12px max(env(safe-area-inset-bottom),12px); flex-shrink:0; display:flex; gap:8px; align-items:flex-end; }
#msgInput { flex:1; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.1); border-radius:20px; padding:10px 16px; color:#fff; font-size:15px; outline:none; font-family:inherit; max-height:100px; resize:none; }
#sendBtn { width:34px; height:34px; border-radius:50%; border:none; background:#1a6ef5; color:#fff; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
#sendBtn:disabled { opacity:0.3; }

/* Discovery */
#discPane { padding:24px; }
.disc-title { font-size:28px; letter-spacing:2px; color:#C9A96E; margin-bottom:6px; }
.disc-sub { font-size:13px; color:#444; margin-bottom:20px; }
#discRefresh { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08); border-radius:10px; padding:10px 20px; color:#C9A96E; font-size:13px; font-weight:600; cursor:pointer; margin-bottom:20px; letter-spacing:1px; }
#discRefresh:disabled { opacity:0.3; }
#discContent { display:flex; flex-direction:column; gap:12px; }
.disc-card { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); border-radius:12px; padding:14px; }
.disc-card-top { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.disc-card-who { font-size:10px; font-weight:700; letter-spacing:1px; }
.disc-card-cat { font-size:10px; color:#555; margin-left:auto; }
.disc-card-title { font-size:15px; font-weight:600; color:#eee; margin-bottom:4px; }
.disc-card-desc { font-size:13px; color:#999; line-height:1.5; }
.disc-card-link { display:inline-block; margin-top:6px; font-size:12px; color:#C9A96E; text-decoration:none; }
.disc-loading { text-align:center; padding:40px; font-size:13px; color:#444; }
</style>

  buildDash();
  buildBoard();
}

function doGear() {
  document.getElementById("apiInput").value = apiKey;
  document.getElementById("app").classList.remove("on");
  document.getElementById("setupScreen").classList.add("on");
}

// ═══════════════════════════════
// TABS
// ═══════════════════════════════

function switchTab(tabId) {
  var panes = document.querySelectorAll(".tab-pane");
  for (var i = 0; i < panes.length; i++) panes[i].classList.remove("active");
  var btns = document.querySelectorAll(".tab-btn");
  for (var i = 0; i < btns.length; i++) btns[i].classList.remove("active");

  document.getElementById(tabId).classList.add("active");
  var clicked = document.querySelector('[data-tab="'+tabId+'"]');
  if (clicked) clicked.classList.add("active");

  if (tabId === "boardPane") buildBoard();
}

// ═══════════════════════════════
// DASHBOARD
// ═══════════════════════════════

function buildDash() {
  var n = new Date();
  var ds = ["SUNDAY","MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY","SATURDAY"];
  var ms = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  document.getElementById("dateEl").textContent = ds[n.getDay()] + " \u2014 " + ms[n.getMonth()] + " " + n.getDate();
  document.getElementById("greetEl").textContent = n.getHours() < 12 ? "MORNING" : n.getHours() < 17 ? "AFTERNOON" : "EVENING";

  var ah = "";
  for (var i = 0; i < ACTIONS.length; i++) {
    var a = ACTIONS[i];
    ah += '<div class="act" style="border-color:'+a.c+'"><div class="bn act-l" style="color:'+a.c+'">'+a.t+'</div><div class="act-d">'+a.d+'</div></div>';
  }
  document.getElementById("actsEl").innerHTML = ah;

  var gh = "";
  for (var i = 0; i < GOALS.length; i++) gh += '<div class="bn goal">'+GOALS[i]+'</div>';
  document.getElementById("goalsEl").innerHTML = gh;
}

// ═══════════════════════════════
// BOARDROOM
// ═══════════════════════════════

function buildBoard() {
  var h = "";
  for (var i = 0; i < CHANNELS.length; i++) {
    var c = CHANNELS[i];
    h += '<button class="ch-btn" data-ch="'+c.id+'"><span class="ch-ico">'+c.ico+'</span><div><div class="ch-nm" style="color:'+c.clr+'">'+c.nm+'</div><div class="ch-sb">'+c.sb+'</div></div><span class="ch-ar">\u203A</span></button>';
  }
  document.getElementById("chListEl").innerHTML = h;
  var btns = document.querySelectorAll("[data-ch]");
  for (var i = 0; i < btns.length; i++) {
    (function(b) { b.addEventListener("click", function() { openChat(b.getAttribute("data-ch")); }); })(btns[i]);
  }
}

// ═══════════════════════════════
// CHAT
// ═══════════════════════════════

function findCh(id) { for (var i=0;i<CHANNELS.length;i++) if(CHANNELS[i].id===id) return CHANNELS[i]; return null; }

function openChat(id) {
  curCh = findCh(id);
  if (!curCh) return;
  document.getElementById("chatNm").textContent = curCh.nm;
  document.getElementById("chatNm").style.color = curCh.clr;
  document.getElementById("chatSb").textContent = curCh.sb;
  document.getElementById("chatIco").textContent = curCh.ico;
  document.getElementById("chatBack").style.color = curCh.clr;
  switchTab("chatPane");
  renderChat();
}

function renderChat() {
  var area = document.getElementById("msgArea");
  var h = hist[curCh.id];
  if (!h.length) { area.innerHTML = '<div class="empty-st">Start talking. They\'re listening.</div>'; return; }
  var html = "";
  for (var i = 0; i < h.length; i++) {
    var m = h[i];
    if (m.role === "user") {
      html += '<div class="msg-user">' + esc(m.text) + '</div>';
    } else {
      var parts = m.parsed || [];
      for (var j = 0; j < parts.length; j++) {
        var p = parts[j];
        var col = CCOLORS[p.name] || "#888";
        html += '<div class="msg-char-wrap"><div class="msg-char-name" style="color:'+col+'">'+esc(p.name)+'</div><div class="msg-char">'+esc(p.text)+'</div></div>';
      }
    }
  }
  area.innerHTML = html;
  area.scrollTop = area.scrollHeight;
}

function parseChars(text, chId) {
  var lines = text.split("\n");
  var result = [];
  var cn = null;
  var ct = [];
  var pat = /^(DANNY|RUSTY|MIKE MAC|WENDY|TYLER|MENTZER|JACOB|NEAL|ARI):\s*(.*)/;
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) continue;
    var match = line.match(pat);
    if (match) {
      if (cn) result.push({name:cn, text:ct.join(" ")});
      cn = match[1]; ct = [match[2]];
    } else if (cn) { ct.push(line); }
  }
  if (cn) result.push({name:cn, text:ct.join(" ")});
  if (!result.length) {
    var fb = {director:"DANNY",therapist:"WENDY",coach:"TYLER",edge:"JACOB",agent:"ARI"};
    result.push({name:fb[chId]||"SYSTEM", text:text});
  }
  return result;
}

async function doSend() {
  var inp = document.getElementById("msgInput");
  var text = inp.value.trim();
  if (!text || busy || !curCh) return;
  inp.value = "";
  busy = true;
  document.getElementById("sendBtn").disabled = true;

  var h = hist[curCh.id];
  h.push({role:"user", text:text});
  renderChat();

  var area = document.getElementById("msgArea");
  var tk = document.createElement("div");
  tk.className = "typing";
  tk.innerHTML = '<span class="typing-dots"><span>.</span><span>.</span><span>.</span></span>';
  area.appendChild(tk);
  area.scrollTop = area.scrollHeight;

  try {
    var msgs = [];
    for (var i = 0; i < h.length; i++) {
      msgs.push({ role: h[i].role === "user" ? "user" : "assistant", content: h[i].role === "user" ? h[i].text : (h[i].raw || "") });
    }
    var data = await callAPI(curCh.id, msgs);
    var raw = getTextFromResponse(data);
    var parsed = parseChars(raw, curCh.id);
    h.push({role:"assistant", parsed:parsed, raw:raw});
  } catch(err) {
    h.push({role:"assistant", parsed:[{name:"SYSTEM",text:"Error: "+err.message}], raw:""});
  }

  if (tk.parentNode) tk.parentNode.removeChild(tk);
  renderChat();
  busy = false;
  document.getElementById("sendBtn").disabled = false;
  inp.focus();
}

// ═══════════════════════════════
// DISCOVERY
// ═══════════════════════════════

async function loadDiscovery() {
  var el = document.getElementById("discContent");
  el.innerHTML = '<div class="disc-loading"><span class="typing-dots"><span>.</span><span>.</span><span>.</span></span> Your boardroom is searching...</div>';
  document.getElementById("discRefresh").disabled = true;

  try {
    var msgs = [{role:"user", content:"Find me some good stuff today. Mix it up."}];
    var data = await callAPI("discovery", msgs);
    var raw = getTextFromResponse(data);
    var parsed = parseChars(raw, "director");

    var html = "";
    for (var i = 0; i < parsed.length; i++) {
      var p = parsed[i];
      var col = CCOLORS[p.name] || "#888";
      // Try to extract URL from text
      var urlMatch = p.text.match(/(https?:\/\/[^\s)]+)/);
      var cleanText = p.text;
      if (urlMatch) cleanText = p.text.replace(urlMatch[0], "").trim();

      html += '<div class="disc-card">';
      html += '<div class="disc-card-top"><span class="disc-card-who" style="color:'+col+'">'+esc(p.name)+'</span></div>';
      html += '<div class="disc-card-desc">' + esc(cleanText) + '</div>';
      if (urlMatch) html += '<a class="disc-card-link" href="'+esc(urlMatch[0])+'" target="_blank">Open \u2192</a>';
      html += '</div>';
    }
    el.innerHTML = html || '<div class="disc-loading">Nothing found. Try again.</div>';
  } catch(err) {
    el.innerHTML = '<div class="disc-loading">Error: '+esc(err.message)+'</div>';
  }

  document.getElementById("discRefresh").disabled = false;
}

// ═══════════════════════════════
// API
// ═══════════════════════════════

async function callAPI(chId, messages) {
  var sysPrompt = chId === "discovery" ? DISC_PROMPT : PROMPTS[chId];
  var body = {
    model: "claude-sonnet-4-20250514",
    max_tokens: 1024,
    system: sysPrompt,
    messages: messages,
    tools: [{type:"web_search_20250305", name:"web_search", max_uses:3}]
  };

  var res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify(body)
  });

  var data = await res.json();
  if (data.error) throw new Error(data.error.message || "API error");
  return data;
}

function getTextFromResponse(data) {
  var texts = [];
  var content = data.content || [];
  for (var i = 0; i < content.length; i++) {
    if (content[i].type === "text" && content[i].text) texts.push(content[i].text);
  }
  return texts.join("\n") || "...";
}

function esc(s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

// ═══════════════════════════════
// EVENT LISTENERS
// ═══════════════════════════════

document.getElementById("enterBtn").addEventListener("click", doEnter);
document.getElementById("apiInput").addEventListener("keydown", function(e) { if (e.key === "Enter") doEnter(); });
document.getElementById("gearBtn").addEventListener("click", doGear);
document.getElementById("chatBack").addEventListener("click", function() { switchTab("boardPane"); });
document.getElementById("sendBtn").addEventListener("click", doSend);
document.getElementById("msgInput").addEventListener("keydown", function(e) { if (e.key === "Enter") doSend(); });
document.getElementById("discRefresh").addEventListener("click", loadDiscovery);

var tabBtns = document.querySelectorAll(".tab-btn");
for (var i = 0; i < tabBtns.length; i++) {
  (function(btn) {
    btn.addEventListener("click", function() { switchTab(btn.getAttribute("data-tab")); });
  })(tabBtns[i]);
}

// ═══════════════════════════════
// INIT
// ═══════════════════════════════

if (apiKey) {
  document.getElementById("app").classList.add("on");
  buildDash();
  buildBoard();
  switchTab("dashPane");
} else {
  document.getElementById("setupScreen").classList.add("on");
}
</script>
