<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#050505">
<title>MOVIE ME</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { background: #050505; color: #fff; font-family: 'IBM Plex Mono', monospace; }
.bn { font-family: 'Bebas Neue', sans-serif; }

.screen { display: none; max-width: 480px; margin: 0 auto; }
.screen.active { display: block; }
#chatScreen.active { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

/* Error display */
#errorBox { display: none; position: fixed; top: 0; left: 0; right: 0; background: #330000; color: #ff6666; padding: 16px; font-size: 11px; font-family: monospace; z-index: 9999; white-space: pre-wrap; }

/* Setup */
#setupScreen { padding: 60px 24px; }
.setup-title { font-size: 44px; letter-spacing: 3px; color: #C9A96E; margin-bottom: 10px; }
.setup-sub { font-size: 13px; color: #555; margin-bottom: 36px; line-height: 1.7; }
.setup-label { font-size: 11px; letter-spacing: 3px; color: #444; margin-bottom: 8px; }
#apiInput {
width: 100%; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
border-radius: 8px; padding: 14px 16px; color: #ddd; font-family: ‘IBM Plex Mono’, monospace;
font-size: 13px; outline: none; margin-bottom: 20px;
}
#apiInput:focus { border-color: rgba(201,169,110,0.4); }
#enterBtn {
width: 100%; background: #C9A96E; border: none; border-radius: 8px; padding: 14px;
color: #000; font-family: ‘Bebas Neue’, sans-serif; font-size: 18px; letter-spacing: 3px; cursor: pointer;
}
#keyError { color: #ff4444; font-size: 12px; margin-top: 8px; display: none; }

/* Dashboard */
#dashScreen { padding: 48px 24px 120px; position: relative; }
.dash-date { font-size: 13px; letter-spacing: 5px; color: #555; margin-bottom: 4px; }
.dash-greet { font-size: 48px; letter-spacing: 3px; color: #C9A96E; line-height: 1; }
.dash-tag { font-size: 13px; color: #555; margin-top: 8px; margin-bottom: 36px; }
#gearBtn { position: absolute; top: 48px; right: 24px; background: none; border: none; color: #444; font-size: 18px; cursor: pointer; }
.sec-title { font-size: 14px; letter-spacing: 4px; color: #444; margin-bottom: 14px; }

.action-item { border-left: 2px solid; padding: 10px 14px; margin-bottom: 10px; background: rgba(255,255,255,0.02); }
.action-label { font-size: 11px; letter-spacing: 2px; margin-bottom: 3px; }
.action-desc { font-size: 13px; color: #bbb; line-height: 1.5; }
.goal-item { font-size: 19px; letter-spacing: 1px; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }

.ch-btn { display: flex; align-items: center; width: 100%; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; padding: 14px; margin-bottom: 8px; cursor: pointer; text-align: left; color: #fff; }
.ch-btn:active { opacity: 0.8; }
.ch-icon { font-size: 22px; margin-right: 12px; }
.ch-name { font-size: 16px; letter-spacing: 1px; }
.ch-sub { font-size: 10px; color: #555; margin-top: 2px; }
.ch-arrow { margin-left: auto; color: #333; }

/* Chat */
.chat-hdr { padding: 48px 24px 14px; border-bottom: 1px solid rgba(255,255,255,0.06); flex-shrink: 0; }
#backBtn { background: none; border: none; font-size: 13px; cursor: pointer; padding: 0; margin-bottom: 8px; font-family: ‘IBM Plex Mono’, monospace; }
.chat-row { display: flex; align-items: center; gap: 10px; }
.chat-title { font-size: 22px; letter-spacing: 2px; }
.chat-sub { font-size: 10px; color: #555; }

#msgArea { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.empty-msg { text-align: center; padding: 60px 20px; font-size: 13px; color: #333; }
.user-bubble { align-self: flex-end; background: rgba(255,255,255,0.08); border-radius: 14px 14px 4px 14px; padding: 10px 14px; max-width: 80%; font-size: 13px; color: #ddd; line-height: 1.6; }
.char-group { display: flex; flex-direction: column; gap: 8px; }
.char-name { font-size: 10px; letter-spacing: 3px; margin-bottom: 3px; }
.char-bubble { border-left: 2px solid; border-radius: 4px 10px 10px 4px; padding: 9px 12px; font-size: 13px; color: #ccc; line-height: 1.6; max-width: 88%; }
.thinking-dot { font-size: 12px; color: #444; padding: 8px 0; animation: pulse 1.5s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

.input-bar { padding: 12px 20px 32px; border-top: 1px solid rgba(255,255,255,0.06); flex-shrink: 0; display: flex; gap: 8px; }
#msgInput { flex: 1; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 11px 14px; color: #ddd; font-family: ‘IBM Plex Mono’, monospace; font-size: 14px; outline: none; }
#sendBtn { border: none; border-radius: 8px; padding: 11px 16px; color: #000; font-family: ‘Bebas Neue’, sans-serif; font-size: 15px; letter-spacing: 2px; cursor: pointer; }
#sendBtn:disabled { opacity: 0.3; }
</style>

</head>
<body>

<div id="errorBox"></div>

<div id="setupScreen" class="screen">
  <div class="bn setup-title">MOVIE ME</div>
  <div class="setup-sub">Your boardroom needs a key.<br>Get one at <strong style="color:#888">console.anthropic.com</strong></div>
  <div class="bn setup-label">API KEY</div>
  <input id="apiInput" type="password" placeholder="sk-ant-..." />
  <button id="enterBtn" class="bn">ENTER THE BOARDROOM</button>
  <div id="keyError"></div>
</div>

<div id="dashScreen" class="screen">
  <button id="gearBtn">&#9881;</button>
  <div class="bn dash-date" id="dateEl"></div>
  <div class="bn dash-greet" id="greetEl"></div>
  <div class="dash-tag">What would movie you do today?</div>
  <div style="margin-bottom: 36px;">
    <div class="bn sec-title">TODAY'S ACTIONS</div>
    <div id="actionsEl"></div>
  </div>
  <div style="margin-bottom: 36px;">
    <div class="bn sec-title">THE GOALS</div>
    <div id="goalsEl"></div>
  </div>
  <div>
    <div class="bn sec-title">THE BOARDROOM</div>
    <div id="channelsEl"></div>
  </div>
</div>

<div id="chatScreen" class="screen">
  <div class="chat-hdr">
    <button id="backBtn">&#8592; BACK</button>
    <div class="chat-row">
      <div id="chatIcon" style="font-size: 22px;"></div>
      <div>
        <div class="bn chat-title" id="chatTitle"></div>
        <div class="chat-sub" id="chatSub"></div>
      </div>
    </div>
  </div>
  <div id="msgArea"><div class="empty-msg">Start talking. They're listening.</div></div>
  <div class="input-bar">
    <input id="msgInput" placeholder="Talk to them..." />
    <button id="sendBtn" class="bn">SEND</button>
  </div>
</div>

<script>

  eb.style.display = "block";
  eb.textContent = "JS Error: " + msg + " (line " + line + ")";
};

var PROACTIVE = {};
PROACTIVE.director = "Zach just opened your channel. Reach out - share a strategic thought for his day, a move he should plan, or how to approach something coming up. Use web search to find something relevant about strategy, presence, or composure. Be friends who text 'thinking about your situation - here is the move.'";

// ═══════════════════════════════════
// CHANNEL DATA

var CHANNELS = [

var GOALS = [

  "HOLD YOUR POSITION",

  "KEEP THE EROTIC EDGE SHARP",

];

var CHAR_COLORS = {

  "WENDY": "#8B5CF6", "TYLER": "#EF4444", "MENTZER": "#F97316",

// ═══════════════════════════════════
// STATE
// ═══════════════════════════════════

var apiKey = "";
var currentChannel = null;
var histories = { director: [], therapist: [], coach: [], edge: [], agent: [] };
var isBusy = false;

// Try to load saved key
try { apiKey = localStorage.getItem("mm_key") || ""; } catch(e) {}

// ═══════════════════════════════════
// SCREEN MANAGEMENT
// ═══════════════════════════════════

function showScreen(id) {
  var screens = document.querySelectorAll(".screen");
  for (var i = 0; i < screens.length; i++) {
    screens[i].classList.remove("active");
  }
  document.getElementById(id).classList.add("active");
}

// ═══════════════════════════════════
// SETUP
// ═══════════════════════════════════

function doSaveKey() {
  var input = document.getElementById("apiInput");
  var k = input.value.trim();
  var err = document.getElementById("keyError");

  if (k.length < 10) {
    err.textContent = "Key seems too short";
    err.style.display = "block";
    return;
  }

  apiKey = k;
  try { localStorage.setItem("mm_key", k); } catch(e) {}
  err.style.display = "none";
  buildDashboard();
  showScreen("dashScreen");
}

function doShowSetup() {
  document.getElementById("apiInput").value = apiKey;
  showScreen("setupScreen");
}

// ═══════════════════════════════════
// DASHBOARD
// ═══════════════════════════════════

function buildDashboard() {
  var now = new Date();
  var days = ["SUNDAY","MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY","SATURDAY"];
  var months = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  var hour = now.getHours();

  document.getElementById("dateEl").textContent = days[now.getDay()] + " \u2014 " + months[now.getMonth()] + " " + now.getDate();
  document.getElementById("greetEl").textContent = hour < 12 ? "MORNING" : (hour < 17 ? "AFTERNOON" : "EVENING");

  // Actions
  var actHtml = "";
  for (var i = 0; i < ACTIONS.length; i++) {
    var a = ACTIONS[i];
    actHtml += '<div class="action-item" style="border-color:' + a.c + '">';
    actHtml += '<div class="bn action-label" style="color:' + a.c + '">' + a.i + ' ' + a.t + '</div>';
    actHtml += '<div class="action-desc">' + a.d + '</div></div>';
  }
  document.getElementById("actionsEl").innerHTML = actHtml;

  // Goals
  var goalHtml = "";
  for (var i = 0; i < GOALS.length; i++) {
    goalHtml += '<div class="bn goal-item">' + GOALS[i] + '</div>';
  }
  document.getElementById("goalsEl").innerHTML = goalHtml;

  // Channels
  var chHtml = "";
  for (var i = 0; i < CHANNELS.length; i++) {
    var ch = CHANNELS[i];
    chHtml += '<button class="ch-btn" data-channel="' + ch.id + '">';
    chHtml += '<div class="ch-icon">' + ch.icon + '</div>';
    chHtml += '<div><div class="bn ch-name" style="color:' + ch.color + '">' + ch.name + '</div>';
    chHtml += '<div class="ch-sub">' + ch.sub + '</div></div>';
    chHtml += '<div class="ch-arrow">\u2192</div></button>';
  }
  document.getElementById("channelsEl").innerHTML = chHtml;

  // Bind channel buttons
  var btns = document.querySelectorAll("[data-channel]");
  for (var i = 0; i < btns.length; i++) {
    (function(btn) {
      btn.addEventListener("click", function() {
        openChannel(btn.getAttribute("data-channel"));
      });
    })(btns[i]);
  }
}

function doShowDash() {
  currentChannel = null;
  buildDashboard();
  showScreen("dashScreen");
}

// ═══════════════════════════════════
// CHAT
// ═══════════════════════════════════

function findChannel(id) {
  for (var i = 0; i < CHANNELS.length; i++) {
    if (CHANNELS[i].id === id) return CHANNELS[i];
  }
  return null;
}

function openChannel(id) {
  currentChannel = findChannel(id);
  if (!currentChannel) return;

  document.getElementById("backBtn").style.color = currentChannel.color;
  document.getElementById("chatIcon").textContent = currentChannel.icon;
  document.getElementById("chatTitle").textContent = currentChannel.name;
  document.getElementById("chatTitle").style.color = currentChannel.color;
  document.getElementById("chatSub").textContent = currentChannel.sub;
  document.getElementById("sendBtn").style.background = currentChannel.color;

  showScreen("chatScreen");
  renderMessages();

  // Proactive messaging
  var h = histories[currentChannel.id];
  if (h.length === 0) {
    triggerProactive(currentChannel.id);
  }
}

function renderMessages() {
  var area = document.getElementById("msgArea");
  var h = histories[currentChannel.id];

  if (h.length === 0) {
    area.innerHTML = '<div class="empty-msg">Start talking. They\'re listening.</div>';
    return;
  }

  var html = "";
  for (var i = 0; i < h.length; i++) {
    var msg = h[i];
    if (msg.role === "user") {
      html += '<div class="user-bubble">' + escapeHtml(msg.text) + '</div>';
    } else {
      html += '<div class="char-group">';
      var parts = msg.parsed || [];
      for (var j = 0; j < parts.length; j++) {
        var p = parts[j];
        var col = CHAR_COLORS[p.name] || "#888";
        html += '<div style="max-width:88%">';
        html += '<div class="bn char-name" style="color:' + col + '">' + escapeHtml(p.name) + '</div>';
        html += '<div class="char-bubble" style="border-color:' + col + ';background:' + col + '11">' + escapeHtml(p.text) + '</div>';
        html += '</div>';
      }
      html += '</div>';
    }
  }

  area.innerHTML = html;
  area.scrollTop = area.scrollHeight;
}

function parseCharacterMessages(text, channelId) {
  var lines = text.split("\n");
  var result = [];
  var currentName = null;
  var currentText = [];
  var charPattern = /^(DANNY|RUSTY|MIKE MAC|WENDY|TYLER|MENTZER|JACOB|NEAL|ARI):\s*(.*)/;

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) continue;
    var match = line.match(charPattern);
    if (match) {
      if (currentName) {
        result.push({ name: currentName, text: currentText.join(" ") });
      }
      currentName = match[1];
      currentText = [match[2]];
    } else if (currentName) {
      currentText.push(line);
    }
  }
  if (currentName) {
    result.push({ name: currentName, text: currentText.join(" ") });
  }

  if (result.length === 0) {
    var fallbacks = { director: "DANNY", therapist: "WENDY", coach: "TYLER", edge: "JACOB", agent: "ARI" };
    result.push({ name: fallbacks[channelId] || "SYSTEM", text: text });
  }

  return result;
}

async function triggerProactive(channelId) {
  if (isBusy) return;
  isBusy = true;

  var area = document.getElementById("msgArea");
  area.innerHTML = '<div class="thinking-dot">thinking...</div>';

  try {
    var messages = [{ role: "user", content: PROACTIVE[channelId] }];
    var data = await callAPI(channelId, messages);
    var rawText = extractTextFromResponse(data);
    var parsed = parseCharacterMessages(rawText, channelId);
    histories[channelId].push({ role: "assistant", parsed: parsed, raw: rawText });
  } catch (err) {
    histories[channelId].push({ role: "assistant", parsed: [{ name: "SYSTEM", text: "Error: " + err.message }], raw: "" });
  }

  renderMessages();
  isBusy = false;
}

async function doSend() {
  var input = document.getElementById("msgInput");
  var text = input.value.trim();
  if (!text || isBusy || !currentChannel) return;

  input.value = "";
  isBusy = true;
  document.getElementById("sendBtn").disabled = true;

  var h = histories[currentChannel.id];
  h.push({ role: "user", text: text });
  renderMessages();

  // Show thinking indicator
  var area = document.getElementById("msgArea");
  var thinkEl = document.createElement("div");
  thinkEl.className = "thinking-dot";
  thinkEl.textContent = "thinking...";
  area.appendChild(thinkEl);
  area.scrollTop = area.scrollHeight;

  try {
    var apiMessages = [];
    for (var i = 0; i < h.length; i++) {
      var m = h[i];
      apiMessages.push({
        role: m.role === "user" ? "user" : "assistant",
        content: m.role === "user" ? m.text : (m.raw || "")
      });
    }

    var data = await callAPI(currentChannel.id, apiMessages);
    var rawText = extractTextFromResponse(data);
    var parsed = parseCharacterMessages(rawText, currentChannel.id);
    h.push({ role: "assistant", parsed: parsed, raw: rawText });
  } catch (err) {
    h.push({ role: "assistant", parsed: [{ name: "SYSTEM", text: "Error: " + err.message }], raw: "" });
  }

  if (thinkEl.parentNode) thinkEl.parentNode.removeChild(thinkEl);
  renderMessages();
  isBusy = false;
  document.getElementById("sendBtn").disabled = false;
  input.focus();
}

// ═══════════════════════════════════
// API
// ═══════════════════════════════════

async function callAPI(channelId, messages) {
  var body = {
    model: "claude-sonnet-4-20250514",
    max_tokens: 1024,
    system: PROMPTS[channelId],
    messages: messages,
    tools: [{ type: "web_search_20250305", name: "web_search", max_uses: 3 }]
  };

  var response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify(body)
  });

  var data = await response.json();

  if (data.error) {
    throw new Error(data.error.message || "API error");
  }

  return data;
}

function extractTextFromResponse(data) {
  var texts = [];
  var content = data.content || [];
  for (var i = 0; i < content.length; i++) {
    if (content[i].type === "text" && content[i].text) {
      texts.push(content[i].text);
    }
  }
  return texts.join("\n") || "...";
}

// ═══════════════════════════════════
// UTILS
// ═══════════════════════════════════

function escapeHtml(str) {
  var div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

// ═══════════════════════════════════
// EVENT LISTENERS
// ═══════════════════════════════════

document.getElementById("enterBtn").addEventListener("click", doSaveKey);
document.getElementById("gearBtn").addEventListener("click", doShowSetup);
document.getElementById("backBtn").addEventListener("click", doShowDash);
document.getElementById("sendBtn").addEventListener("click", doSend);
document.getElementById("msgInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter") doSend();
});
document.getElementById("apiInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter") doSaveKey();
});

// ═══════════════════════════════════
// INIT
// ═══════════════════════════════════

if (apiKey) {
  buildDashboard();
  showScreen("dashScreen");
} else {
  showScreen("setupScreen");
}
